services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    hostname: bpir4
    env_file:
      - .env
    volumes:
      - /mnt/nvme0n1p2/dockerData/tailscale:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
    restart: unless-stopped
