---
services:
  syncthing:
    image: syncthing/syncthing
    container_name: syncthing
    hostname: my-syncthing
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - /mnt/nvme0n1p2/dockerData/syncthing:/var/syncthing
      - /mnt/ext-a/Phonepix/pocoX4:/mnt/ext-a/Phonepix/pocoX4
      - /mnt/ext-a/Phonepix/pixel6:/mnt/ext-a/Phonepix/pixel6
      - /mnt/ext-a/Phonepix/pixel7a:/mnt/ext-a/Phonepix/pixel7a
      - /mnt/ext-a/Phonepix/oneplus5:/mnt/ext-a/Phonepix/oneplus5
      - /mnt/ext-a/Phonepix/s25:/mnt/ext-a/Phonepix/s25
      - /mnt/ext-a/Phonepix/pixel9-fold:/mnt/ext-a/Phonepix/pixel9-fold
      - /mnt/ext-a/Phonepix/pixel6-aarna:/mnt/ext-a/Phonepix/pixel6-aarna
    ports:
      - 8384:8384 # Web UI
      - 22000:22000/tcp # TCP file transfers
      - 22000:22000/udp # QUIC file transfers
      - 21027:21027/udp # Receive local discovery broadcasts
    restart: unless-stopped
    healthcheck:
      test: curl -fkLsS -m 2 127.0.0.1:8384/rest/noauth/health | grep -o --color=never OK || exit 1
      interval: 1m
      timeout: 10s
      retries: 3
